name: Feature request
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你遇到什么问题，现有功能为什么不够
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议符合单用户、自托管聚合邮箱的定位
          required: true
